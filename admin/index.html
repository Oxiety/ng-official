<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<title>Админ-панель · northling</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#0a0630;--bg2:#1a0e5a;--card:rgba(40,24,120,.55);--line:rgba(255,255,255,.22);--text:#fff;--muted:#cfc6ff;--acc:#9fe9ff;--hot:#ff5fd2;--ok:#5ff3a0;--err:#ff7a8a}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;min-height:100vh;color:var(--text);font:16px/1.5 'Nunito','Segoe UI',system-ui,sans-serif;background:radial-gradient(ellipse 90% 40% at 50% -10%,rgba(150,120,255,.45),transparent 70%),linear-gradient(180deg,var(--bg),var(--bg2) 70%,#2b1b84) fixed;padding-bottom:96px}
a{color:var(--acc)}
.wrap{width:min(980px,calc(100% - 28px));margin:0 auto}
header.top{position:sticky;top:0;z-index:20;background:rgba(10,6,48,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding:10px 0;flex-wrap:wrap}
.logo{font:800 20px/1 'Unbounded','Nunito',sans-serif;letter-spacing:-.03em}.logo span{color:var(--hot)}
.repo{color:var(--muted);font-size:13px;margin-left:auto;word-break:break-all}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:thin}
.tab{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--text);border-radius:999px;padding:8px 16px;font:700 14px inherit;font-family:inherit;cursor:pointer}
.tab[aria-selected=true]{background:linear-gradient(180deg,#b9a6ff,#6a3fe0);border-color:#fff;box-shadow:0 0 14px rgba(159,233,255,.5)}
.tab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--hot);margin-left:6px}
main{padding:20px 0}
.card{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:16px;margin:0 0 14px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
h1,h2,h3{font-family:'Unbounded','Nunito',sans-serif;letter-spacing:-.02em;margin:0 0 10px}
h2{font-size:22px}h3{font-size:16px;color:var(--acc)}
.muted{color:var(--muted);font-size:14px}
label.f{display:block;margin:0 0 12px}
label.f>span.l{display:block;font-weight:800;font-size:13px;color:var(--muted);margin:0 0 4px}
input[type=text],input[type=password],textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;background:rgba(8,4,40,.7);color:var(--text);padding:10px 12px;font:inherit}
textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--acc);outline-offset:1px}
.btn{border:1px solid rgba(255,255,255,.6);border-radius:10px;padding:8px 14px;font:800 14px inherit;font-family:inherit;color:#fff;cursor:pointer;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.06))}
.btn:hover{border-color:#fff;box-shadow:0 0 12px rgba(159,233,255,.6)}
.btn.primary{background:linear-gradient(180deg,#c6adff,#7a4cf0 50%,#5a2fd0 51%,#8a63f2);}
.btn.danger{border-color:rgba(255,122,138,.8);color:#ffd0d6}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
details.item{border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.05);margin:0 0 10px}
details.item>summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;gap:8px;align-items:center}
details.item>summary::-webkit-details-marker{display:none}
details.item>summary:before{content:"▸";color:var(--acc)}
details.item[open]>summary:before{content:"▾"}
details.item>summary .t{flex:1;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.item>.body{padding:4px 12px 8px}
.prim{display:flex;gap:6px;margin:0 0 8px}
.sub{margin:10px 0 14px;padding-left:10px;border-left:2px solid var(--line)}
.thumb{width:84px;height:84px;object-fit:cover;border-radius:10px;border:2px solid #fff;background:#fff2;flex:none}
.imgc{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.imgc .info{flex:1;min-width:200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.m{border:1px solid var(--line);border-radius:12px;padding:8px;background:rgba(255,255,255,.05);font-size:12px;word-break:break-all}
.m img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block;margin:0 0 6px;background:#0004}
.m.new{border-color:var(--ok)}.m.del{opacity:.4}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,6,48,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.savebar .wrap{display:flex;gap:12px;align-items:center;padding:12px 0}
.status{flex:1;font-size:14px;color:var(--muted)}.status.dirty{color:var(--hot);font-weight:800}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:60;max-width:min(560px,calc(100% - 28px));display:none;padding:12px 16px;border-radius:12px;border:1px solid #fff;background:#2b1b84;box-shadow:0 10px 30px #000a}
#toast.err{background:#6b1030}#toast.ok{background:#0b4a3a}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,2,30,.8);display:grid;place-items:center;padding:14px}
.modal .box{width:min(860px,100%);max-height:88vh;overflow:auto;background:var(--bg2);border:1px solid #fff;border-radius:16px;padding:16px}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
ol.steps{padding-left:20px;margin:8px 0}ol.steps li{margin:4px 0}
code{background:rgba(255,255,255,.12);padding:1px 6px;border-radius:6px;font-size:.92em}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.chk input{width:18px;height:18px}
@media(max-width:600px){.repo{margin-left:0;width:100%}.thumb{width:64px;height:64px}}

/* кадрирование (только компьютер) */
.fitc{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.fitbox{position:relative;width:240px;overflow:hidden;border-radius:12px;border:2px solid var(--line,#444);background:#000;cursor:grab;touch-action:none;user-select:none;flex:none}
.fitbox.drag{cursor:grabbing}
.fitbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.fitctl{display:flex;flex-direction:column;gap:8px;min-width:200px}
.fitctl input[type=range]{width:200px}

/* заголовки разделов во вкладке «Тексты и обложки» */
.field.sect{margin:30px 0 4px;padding-top:14px;border-top:2px solid var(--line,#444)}
.field.sect:first-child{margin-top:4px;border-top:0;padding-top:0}
.sect-t{margin:0;font-size:20px}
</style>
</head>

async function gh(path,opts={}){
  const r=await fetch('https://api.github.com'+path,{...opts,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+cfg.token,'X-GitHub-Api-Version':'2022-11-28',...(opts.headers||{})}});
  if(!r.ok){let m='';try{m=(await r.json()).message}catch(_){}const e=new Error('GitHub '+r.status+': '+(m||r.statusText));e.status=r.status;throw e}
  return r;
}

async function loadFile(f){
  try{
    const r=await gh(repoPath()+'/contents/'+f.file+'?ref='+encodeURIComponent(cfg.branch),{headers:{'Accept':'application/vnd.github.raw+json'}});
    const data=parseJsonLoose(await r.text(),f.file);
    S.files[f.id]={data,orig:JSON.stringify(data)};
  }catch(e){
    if(e.status===404){S.files[f.id]={data:{},orig:'{}',missing:true}}else throw e;
  }
}
/* Чтение JSON с прощением мелких ошибок: лишние запятые перед } или ] (частый след ручной правки на GitHub)
   убираются автоматически. При сохранении панель запишет файл уже чистым. Если файл сломан сильнее,
   ошибка называет файл, строку и показывает место. */
function parseJsonLoose(text,name){
  text=text.replace(/^\uFEFF/,'');
  try{return JSON.parse(text)}catch(first){
    let out='',inStr=false,esc=false;
    for(let i=0;i<text.length;i++){
      const c=text[i];
      if(inStr){out+=c;if(esc)esc=false;else if(c==='\\')esc=true;else if(c==='"')inStr=false;continue}
      if(c==='"'){inStr=true;out+=c;continue}
      if(c===','){let j=i+1;while(j<text.length&&/\s/.test(text[j]))j++;if(text[j]==='}'||text[j]===']')continue}
      out+=c;
    }
    try{const data=JSON.parse(out);console.warn('Файл '+name+': убраны лишние запятые (исправится при сохранении)');return data}catch(_){}
    const m=/position (\d+)/.exec(first.message);
    let where='';
    if(m){const pos=+m[1],before=text.slice(0,pos),line=before.split('\n').length,col=pos-before.lastIndexOf('\n');
      where=' (строка '+line+', столбец '+col+'): «'+text.slice(Math.max(0,pos-40),pos+20).replace(/\s+/g,' ')+'»'}
    throw new Error('Файл '+name+' сломан: '+first.message+where);
  }
}
async function loadMedia(){

}

function updateTabs(){

function updateBar(){
  const s=$('#status'),b=$('#save');if(!s)return;
  const d=isDirty();
  const parts=[];flatFiles.forEach(f=>{if(fileDirty(f))parts.push(f.tab)});
  if(S.staged.size)parts.push('новых картинок: '+S.staged.size);

function renderFields(fields,obj,root,prune){
  fields.forEach(f=>{
    const w=f.widget||'string';
    const wrap=h('div',{class:'field','data-label':(f.label||f.name).toLowerCase()});
    if(w==='list'){
      wrap.append(h('h3',{},f.label));
      if(!Array.isArray(obj[f.name]))obj[f.name]=[];
      wrap.append(listControl(f,obj[f.name]));
    }else{
      if(w==='section'){wrap.className='field sect';wrap.dataset.label='';wrap.append(h('h2',{class:'sect-t'},f.label));if(f.hint)wrap.append(h('p',{class:'muted',style:'margin:2px 0 0'},f.hint));root.append(wrap);return}
      if(w==='fit'){wrap.append(h('div',{class:'f'},h('span',{class:'l'},f.label),fitControl(f,obj,f.name)));root.append(wrap);return}
      const lab=h('label',{class:'f'},h('span',{class:'l'},f.label+(f.required===false?'':' *')));
      if(w==='image'){lab.append(imageControl(f,obj,f.name,prune))}
      else lab.append(inputControl(f,obj,f.name,prune));
      wrap.append(lab);

function setVal(f,obj,key,v,prune){
  if(prune&&v===''&&f.required===false)delete obj[key];else obj[key]=v;

}
function inputControl(f,obj,key,prune){
  const w=f.widget||'string';let el;
  if(w==='text'){el=h('textarea',{rows:3})}
  else if(w==='select'){el=h('select',{},(f.options||[]).map(o=>h('option',{value:o},o)))}
  else el=h('input',{type:'text',autocomplete:'off'});
  el.value=obj[key]??(w==='select'?(f.options||[''])[0]:'');
  el.addEventListener(w==='select'?'change':'input',()=>setVal(f,obj,key,el.value,prune));
  return el;
}

  });
  upd();
  return h('div',{class:'imgc'},prev,h('div',{class:'info'},inp,h('div',{class:'row',style:'margin-top:8px'},
    h('button',{type:'button',class:'btn sm',onclick:()=>file.click()},'⬆ Загрузить с устройства'),
    h('button',{type:'button',class:'btn sm',onclick:()=>openPicker(p=>{setVal(f,obj,key,publicPath(p),prune);upd()})},'Выбрать из загруженных'),
    h('button',{type:'button',class:'btn sm danger',onclick:()=>{setVal(f,obj,key,'',prune);upd()}},'Убрать')),file));
}


/* ——— кадрирование картинки в рамке (только на компьютере) ———
   Хранится {x,y,z}: x,y — сдвиг (0..100, как object-position), z — приближение (1..4).
   Формула та же, что на сайте: object-fit:cover + object-position:x% y% + transform:scale(z) от той же точки. */
const isDesktop=()=>matchMedia('(hover: hover) and (pointer: fine)').matches&&innerWidth>=900;
function fitControl(f,obj,key){
  if(!isDesktop())return h('p',{class:'muted'},'Кадрирование доступно только с компьютера. Текущая настройка сохранится как есть.');
  const mob=f.device==='mobile';                 // true: рамка телефона, false: рамка компьютера
  let ratio=String(f.ratio||'4/5');
  const baseDef={x:(f.default&&f.default.x)??50,y:(f.default&&f.default.y)??50,z:1};
  const asFit=v=>v&&typeof v==='object'?v:{};
  // что действует, если для этого устройства ничего не задано: для телефона это настройка компьютера
  const def=()=>mob?{...baseDef,...asFit(obj[f.fallback_field])}:baseDef;
  const cur=()=>({...def(),...asFit(obj[key])});
  const box=h('div',{class:'fitbox',style:'width:'+(mob?'170':'240')+'px'});
  const img=h('img',{alt:''});box.append(img);
  const zoom=h('input',{type:'range',min:'1',max:'4',step:'0.01'});
  const label=h('span',{class:'muted',style:'font-size:12px'});
  const paint=()=>{
    let r=ratio;
    if(mob&&f.ratio_first){const det=box.closest('details.item');if(det&&[...det.parentElement.children].indexOf(det)===0)r=f.ratio_first}   // первая карточка на телефоне шире
    const [rw,rh]=r.split('/').map(Number);box.style.aspectRatio=rw+'/'+rh;
    const s=cur();
    img.style.objectPosition=s.x+'% '+s.y+'%';
    img.style.transformOrigin=s.x+'% '+s.y+'%';
    img.style.transform='scale('+s.z+')';
    zoom.value=s.z;label.textContent='Приближение ×'+Number(s.z).toFixed(2)+' · сдвиг '+Math.round(s.x)+'% / '+Math.round(s.y)+'%'+(obj[key]?'':' · (как '+(mob?'на компьютере':'по умолчанию')+')');
    const v=obj[f.image_field]||'';const src=v?previewSrc(v):'';
    if(src&&img.getAttribute('src')!==src)img.src=src;
    box.style.opacity=src?'':'.35';
  };
  const commit=s=>{
    s={x:Math.round(s.x*10)/10,y:Math.round(s.y*10)/10,z:Math.round(s.z*100)/100};
    const d=def();
    if(s.x===d.x&&s.y===d.y&&s.z===d.z)delete obj[key];else obj[key]=s;
    touch();paint();
  };
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
  let drag=null;
  box.addEventListener('pointerdown',e=>{box.setPointerCapture(e.pointerId);drag={px:e.clientX,py:e.clientY,s:cur()};box.classList.add('drag')});
  box.addEventListener('pointermove',e=>{
    if(!drag||!img.naturalWidth)return;
    const w=box.clientWidth,hh=box.clientHeight,k=Math.max(w/img.naturalWidth,hh/img.naturalHeight);
    const Wi=img.naturalWidth*k,Hi=img.naturalHeight*k,z=drag.s.z;
    const denX=w-z*Wi,denY=hh-z*Hi;             // края картинки: x=0 слева, x=100 справа
    const s={...drag.s};
    if(Math.abs(denX)>1)s.x=clamp(drag.s.x+(e.clientX-drag.px)/denX*100,0,100);
    if(Math.abs(denY)>1)s.y=clamp(drag.s.y+(e.clientY-drag.py)/denY*100,0,100);
    commit(s);
  });
  const stop=()=>{drag=null;box.classList.remove('drag')};
  box.addEventListener('pointerup',stop);box.addEventListener('pointercancel',stop);
  box.addEventListener('wheel',e=>{e.preventDefault();const s=cur();s.z=clamp(s.z-e.deltaY*0.002,1,4);commit(s)},{passive:false});
  zoom.addEventListener('input',()=>{const s=cur();s.z=+zoom.value;commit(s)});
  const reset=h('button',{type:'button',class:'btn sm',onclick:()=>{delete obj[key];touch();paint()}},'Сбросить');
  paint();
  const timer=setInterval(()=>{if(!box.isConnected)clearInterval(timer);else paint()},800);  // подхватить смену картинки
  return h('div',{class:'fitc'},box,h('div',{class:'fitctl'},
    h('span',{class:'muted',style:'font-size:12px'},(mob?'Рамка телефона (экран до 760px). ':'Рамка компьютера. ')+'Тяни картинку мышкой, колесо или ползунок: приближение.'+(mob?' Пока не тронешь, на телефоне будет как на компьютере.':'')),
    zoom,label,reset));
}
function newItem(fields){
  const o={};fields.forEach(f=>{const w=f.widget||'string';if(w==='list')o[f.name]=[];else if(w==='select')o[f.name]=(f.options||[''])[0];else if(f.required!==false)o[f.name]=''});return o;
}
function summaryOf(f,item){
  const tpl=f.summary||'{{fields.'+(f.fields[0]?.name||'title')+'}}';
  const s=tpl.replace(/\{\{fields\.(\w+)\}\}/g,(_,k)=>item[k]??'').replace(/\(\s*\)/g,'').trim();
  return s||'(без названия)';
}
function listControl(f,arr){
  const box=h('div',{});
  const prim=!f.fields;
  const move=(i,d)=>{const j=i+d;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];touch();draw()};
  const del=i=>{if(!confirm('Удалить этот элемент?'))return;arr.splice(i,1);touch();draw()};
  function draw(){
    box.innerHTML='';
    arr.forEach((item,i)=>{
      const ctrl=(extra)=>[
        h('button',{type:'button',class:'btn sm',title:'Вверх',onclick:e=>{e.preventDefault();move(i,-1)}},'↑'),
        h('button',{type:'button',class:'btn sm',title:'Вниз',onclick:e=>{e.preventDefault();move(i,1)}},'↓'),
        h('button',{type:'button',class:'btn sm danger',title:'Удалить',onclick:e=>{e.preventDefault();del(i)}},'✕')];
      if(prim){
        const inp=h('input',{type:'text',value:item,autocomplete:'off'});
        inp.addEventListener('input',()=>{arr[i]=inp.value;touch()});
        box.append(h('div',{class:'prim'},inp,...ctrl()));
      }else{
        const title=h('span',{class:'t'},summaryOf(f,item));
        const det=h('details',{class:'item'},h('summary',{},title,...ctrl()));
        const body=h('div',{class:'body'});
        renderFields(f.fields,item,body,true);
        body.addEventListener('input',()=>{title.textContent=summaryOf(f,item)});
        det.append(body);
        box.append(det);
      }
    });
    box.append(h('button',{type:'button',class:'btn sm',onclick:()=>{
      if(prim)arr.push('');else arr.push(newItem(f.fields));
      touch();draw();
      const last=box.querySelectorAll(prim?'.prim input':'details.item');
      const el=last[last.length-1];if(el){if(!prim)el.open=true;el.scrollIntoView({block:'center'});if(prim)el.focus()}
    }},'+ Добавить'));
    if(f.bulk){            // «добавить списком»: по строке на элемент, поля через | (например: Название | ссылка)
      const ta=h('textarea',{rows:'6',placeholder:'Название трека | https://ссылка\nДругой трек | https://ссылка',style:'width:100%;margin-top:8px;display:none'});
      const go=h('button',{type:'button',class:'btn sm',style:'display:none;margin-top:6px',onclick:()=>{
        let n=0;
        ta.value.split('\n').forEach(line=>{
          const parts=line.split(/\s*[|\t]\s*/);if(parts.length<f.bulk.length||!parts[0].trim())return;
          const it=newItem(f.fields);f.bulk.forEach((k,j)=>{it[k]=(parts[j]||'').trim()});arr.push(it);n++;
        });
        if(!n){toast('Не нашёл ни одной строки вида «Название | ссылка»','err');return}
        ta.value='';touch();draw();toast('Добавлено: '+n,'ok');
      }},'Добавить из списка');
      box.append(h('button',{type:'button',class:'btn sm',style:'margin-left:8px',onclick:()=>{const v=ta.style.display==='none';ta.style.display=v?'':'none';go.style.display=v?'':'none'}},'⇪ Добавить списком'),ta,go);
    }
  }
  draw();
  return box;
}

/* ——— картинки ——— */
const b64FromBlob=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)});
function loadImg(blob){return new Promise((res,rej)=>{const u=URL.createObjectURL(blob);const i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Не удалось прочитать картинку'))};i.src=u})}
async function maybeResize(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type))return file;
  const img=await loadImg(file);const m=Math.max(img.naturalWidth,img.naturalHeight);
  if(m<=MAX_SIDE&&file.size<8*1024*1024)return file;
  const tooBig=m>MAX_SIDE;
  const k=Math.min(1,MAX_SIDE/m);
  const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const type=file.type==='image/png'?'image/png':file.type;
  const blob=await new Promise(r=>c.toBlob(r,type,.9));
  return blob&&(tooBig||blob.size<file.size)?blob:file;
}
async function stageFile(file){
  if(!file.type.startsWith('image/'))throw new Error('Это не картинка');
  const blob=await maybeResize(file);
  if(blob.size>25*1024*1024)throw new Error('Файл больше 25 МБ, уменьши его');
  const ext=((file.name.match(/\.([a-z0-9]+)$/i)||[])[1]||blob.type.split('/')[1]||'jpg').toLowerCase().replace('jpeg','jpg');
  const base=file.name.replace(/\.[^.]+$/,'').toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'img';
  const name=base+'-'+Math.random().toString(36).slice(2,7)+'.'+ext;
  const path=MEDIA_DIR+'/'+name;
  const url=URL.createObjectURL(blob);S.cache.set(path,url);
  S.staged.set(path,{name,path,size:blob.size,b64:await b64FromBlob(blob),url});
  touch();return path;
}
function mediaItems(){
  const items=(S.media||[]).map(m=>({...m,state:S.deleted.has(m.path)?'del':''}));
  S.staged.forEach(s=>items.unshift({name:s.name,path:s.path,size:s.size,state:'new',url:s.url}));
  return items;
}
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' МБ':Math.round(n/1024)+' КБ';
function renderMedia(){
  const box=h('div',{});
  const file=h('input',{type:'file',accept:'image/*',multiple:true,style:'display:none'});
  file.addEventListener('change',async()=>{
    for(const f of file.files){try{await stageFile(f)}catch(e){toast(f.name+': '+e.message,'err')}}
    file.value='';renderMain();
  });
  box.append(h('h2',{},'Медиа: '+MEDIA_DIR),
    h('p',{class:'muted'},'Загружай картинки сюда или прямо в нужном поле (галереи, обложки). Большие фото (больше 2400px или 8 МБ) автоматически уменьшаются. Новые файлы попадают на сайт после «Сохранить на сайт».'),
    h('div',{class:'row',style:'margin:0 0 14px'},h('button',{class:'btn primary',onclick:()=>file.click()},'⬆ Загрузить картинки'),file));
  const grid=h('div',{class:'grid'});
  mediaItems().forEach(m=>{
    const isNew=m.state==='new',isDel=m.state==='del';
    grid.append(h('div',{class:'m '+m.state},
      h('img',{src:previewSrc(m.path),alt:'',loading:'lazy'}),
      h('div',{},m.name),h('div',{class:'muted',style:'font-size:12px'},kb(m.size)+(isNew?' · новая':isDel?' · будет удалена':'')),
      h('div',{class:'row',style:'margin-top:6px'},
        h('button',{class:'btn sm',onclick:async()=>{try{await navigator.clipboard.writeText(publicPath(m.path));toast('Путь скопирован: '+publicPath(m.path),'ok')}catch(_){prompt('Скопируй путь:',publicPath(m.path))}}},'Путь'),
        isDel?h('button',{class:'btn sm',onclick:()=>{S.deleted.delete(m.path);renderMain()}},'Вернуть')
        :h('button',{class:'btn sm danger',onclick:()=>{if(!confirm('Удалить '+m.name+'? Если она где-то используется, там пропадёт картинка.'))return;if(isNew){S.staged.delete(m.path)}else S.deleted.add(m.path);renderMain()}},'✕'))));
  });
  if(!grid.children.length)grid.append(h('p',{class:'muted'},'Пока пусто.'));
  box.append(grid);return box;
}
function openPicker(onPick){
  const m=$('#modal');m.innerHTML='';
  const close=()=>m.innerHTML='';
  const grid=h('div',{class:'grid'});
  mediaItems().filter(x=>x.state!=='del').forEach(x=>grid.append(h('button',{type:'button',class:'m '+x.state,style:'cursor:pointer;color:inherit;text-align:left;font:inherit',onclick:()=>{onPick(x.path);close()}},h('img',{src:previewSrc(x.path),alt:''}),x.name)));
  if(!grid.children.length)grid.append(h('p',{class:'muted'},'В '+MEDIA_DIR+' пока ничего нет. Загрузи картинку.'));
  m.append(h('div',{class:'modal',onclick:e=>{if(e.target.classList.contains('modal'))close()}},h('div',{class:'box'},h('div',{class:'row',style:'margin:0 0 12px'},h('h2',{style:'margin:0;flex:1'},'Выбери картинку'),h('button',{class:'btn sm',onclick:close},'Закрыть')),grid)));
}

/* ——— сохранение: один коммит на всё ——— */
let saving=false;
async function save(){
  if(saving||!isDirty())return;saving=true;
  const btn=$('#save');btn.disabled=true;btn.textContent='Сохраняю…';
  try{
    const ref=await ghJson(repoPath()+'/git/ref/heads/'+encodeURIComponent(cfg.branch).replace(/%2F/g,'/'));
    const headSha=ref.object.sha;
    const commit=await ghJson(repoPath()+'/git/commits/'+headSha);
    const entries=[];
    for(const f of flatFiles){
      if(!fileDirty(f))continue;
      const text=JSON.stringify(S.files[f.id].data,null,2)+'\n';
      const b=await post('/git/blobs',{content:text,encoding:'utf-8'});
      entries.push({path:f.file,mode:'100644',type:'blob',sha:b.sha});
    }
    for(const s of S.staged.values()){
      if(S.deleted.has(s.path))continue;
      const b=await post('/git/blobs',{content:s.b64,encoding:'base64'});
      entries.push({path:s.path,mode:'100644',type:'blob',sha:b.sha});
    }
    S.deleted.forEach(p=>{if(!S.staged.has(p))entries.push({path:p,mode:'100644',type:'blob',sha:null})});
    const tree=await post('/git/trees',{base_tree:commit.tree.sha,tree:entries});
    const parts=[];flatFiles.forEach(f=>{if(fileDirty(f))parts.push(f.tab)});
    if(S.staged.size)parts.push('картинки');if(S.deleted.size)parts.push('удаление файлов');
    const nc=await post('/git/commits',{message:'Админ-панель: '+parts.join(', '),tree:tree.sha,parents:[headSha]});
    await post('/git/refs/heads/'+cfg.branch,{sha:nc.sha},'PATCH');
    flatFiles.forEach(f=>{const s=S.files[f.id];s.orig=JSON.stringify(s.data);s.missing=false});
    S.staged.clear();S.deleted.clear();await loadMedia();
    renderMain();
    toast('Сохранено! Vercel пересоберёт сайт, обычно это занимает около минуты.','ok');
  }catch(e){
    toast('Не сохранилось: '+e.message+(e.status===422?' (возможно, ветка изменилась. Обнови страницу и повтори)':''),'err');
  }finally{saving=false;const b=$('#save');if(b){b.textContent='Сохранить на сайт';updateBar()}}
}

/* ——— старт ——— */
if(cfg.repo&&cfg.token)start();else renderSetup('');
